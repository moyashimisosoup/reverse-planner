name: Deploy Reverse Planner to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy static app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test reverse-planning engine
        run: node --test tests/core.test.mjs

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html _site/
          cp assets/app.css assets/app.js assets/core.mjs _site/assets/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/core.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
