name: Test and deploy Reverse Planner

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify scripts and planning data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate app syntax
        run: node --check assets/app.js
      - name: Run all tests
        run: node --test tests/*.test.mjs
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Run Chromium browser smoke tests
        run: node tests/browser-smoke.mjs
      - name: Verify static references
        run: |
          test -s index.html
          test -s assets/app.css
          test -s assets/app.js
          test -s assets/core.mjs
          test -s assets/state.mjs

  deploy:
    name: Publish GitHub Pages
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html _site/
          cp assets/app.css assets/app.js assets/core.mjs assets/state.mjs _site/assets/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/state.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
